# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

formats: all

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  apt_packages:
    - freeglut3-dev
  jobs:
    # Running every example takes about twenty minutes, and a build here
    # is stopped at fifteen. The documentation workflow runs them on a
    # machine without that limit and publishes what they produced, keyed
    # by a digest of the example inputs and of the library. Restore that
    # and Sphinx-Gallery skips the examples.
    #
    # The archive is only restored when its digest is the digest of this
    # commit, so an edited example is never served with older figures.
    # When there is no archive to match, nothing is restored, the
    # examples run, and the build is likely to time out. That is the
    # intended failure: publish the cache for this commit, then rebuild.
    post_install:
      - python docs/example_cache.py name > /tmp/cache_name
      - |
        curl -sSfL -o /tmp/examples.tar.gz \
          "https://github.com/kip-hart/MicroStructPy/releases/download/docs-cache/$(cat /tmp/cache_name)" \
          && python docs/example_cache.py restore /tmp/examples.tar.gz \
          || echo "No example cache for this commit, the examples will be run."

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
    install:
    - requirements: docs/requirements.txt
    - requirements: requirements.txt
    - method: pip
      path: .
